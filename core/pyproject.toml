[project]
name = "townrecord"
version = "0.1.0"
description = "TownRecord core service: local-first civic record capture."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    # The API browser has to work on a machine with no network (spec 17), so
    # the Swagger UI and ReDoc assets are served from this package's own files
    # rather than from a CDN. Pinned: the bytes are the ones the tests hash.
    "fastapi-offline==1.7.7",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "tzdata>=2025.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
# The one command that runs TownRecord (spec 14.2): the desktop shell starts and
# stops this, and `townrecord serve` starts the API, the job workers and the
# daily schedule together.
townrecord = "townrecord.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/townrecord"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are written as `Depends(...)` in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Reaches the network or runs a real tool install, so CI can deselect it:
    # `uv run pytest -m "not integration"`.
    "integration: really installs a tool through PyPI; needs uv and the network",
]
